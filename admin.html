<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Sweet Crumbs Admin

</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="admin-container">

<aside class="sidebar">

<h2>

🍪 Sweet Crumbs

</h2>

<ul>

<li class="active">

<i class="fa-solid fa-chart-line"></i>

Dashboard

</li>

<li>

<i class="fa-solid fa-cookie-bite"></i>

Products

</li>

<li>

<i class="fa-solid fa-box"></i>

Orders

</li>

<li>

<i class="fa-solid fa-users"></i>

Users

</li>

<li>

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</li>

</ul>

</aside>



<main class="admin-main">

<h1>

Admin Dashboard

</h1>



<div class="dashboard-cards">

<div class="dashboard-card">

<h2 id="totalProducts">

0

</h2>

<p>

Products

</p>

</div>

<div class="dashboard-card">

<h2 id="totalOrders">

0

</h2>

<p>

Orders

</p>

</div>

<div class="dashboard-card">

<h2 id="totalUsers">

0

</h2>

<p>

Users

</p>

</div>

<div class="dashboard-card">

<h2 id="totalRevenue">

$0

</h2>

<p>

Revenue

</p>

</div>

</div>



<section class="add-product">

<h2>

Add Product

</h2>

<form id="productForm">

<input
type="text"
id="productName"
placeholder="Product Name"
required>

<input
type="number"
id="productPrice"
placeholder="Price"
required>

<select id="productCategory">

<option>

Cookie

</option>

<option>

Brownie

</option>

</select>

<input
type="text"
id="productImage"
placeholder="Image Path">

<textarea
id="productDescription"
placeholder="Description"></textarea>

<button
class="btn"
type="submit">

Add Product

</button>

</form>

</section>



<section class="products-table">

<h2>

All Products

</h2>

<table>

<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Category</th>

<th>Price</th>

<th>Action</th>

</tr>

</thead>

<tbody id="productTable">

<!-- Products Here -->

</tbody>

</table>

</section></main>

</div>

<script src="js/products.js"></script>
<script src="js/admin.js"></script>

</body>

</html>
